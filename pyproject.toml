[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p2000-capcodes"
version = "0.4.0"
description = "Build, validate and publish a provenance-aware Dutch P2000 capcode database"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "XMaarten" }]
dependencies = [
  "requests>=2.32,<3",
  "PyYAML>=6.0,<7",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
scrape = [
  "playwright>=1.55,<2",
]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.12,<1",
  "playwright>=1.55,<2",
]

[project.scripts]
p2000-capcodes = "p2000_capcodes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
